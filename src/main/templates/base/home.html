{% extends "base.html" %}
{% load static %}

{% block title %}Início{% endblock %}

{% block content %}
<div class="container py-6">
  <section class="section">
    <div class="box has-background-black-bis">
      <h1 class="title has-text-primary">Bem-vindo ao ToDo</h1>
      <p class="subtitle has-text-grey-light">Gerencie suas tarefas e anotações de forma simples.</p>
      {% if user.is_authenticated %}
        <a class="button is-primary" href="{% url 'main:welcome' id_user=user.id %}">Ir para o painel</a>
      {% else %}
        <a class="button is-primary" href="{% url 'main:login' %}">Entrar</a>
      {% endif %}
    </div>
  </section>
</div>
{% endblock %}
