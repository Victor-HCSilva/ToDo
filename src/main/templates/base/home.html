{% extends "base.html" %}
{% load static %}

{% block title %}Início{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-16 text-center">
    <div class="bg-gray-800 rounded-xl shadow-lg p-10 border border-gray-700">
        <h1 class="text-4xl font-bold text-white mb-3">Bem-vindo ao Brain 🧠</h1>
        <p class="text-gray-400 text-lg mb-8">Gerencie suas tarefas e anotações de forma simples.</p>
        {% if user.is_authenticated %}
        <a href="{% url 'main:welcome' id_user=user.id %}" class="inline-flex items-center gap-2 px-6 py-3 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg transition-colors">
            <i class="fas fa-rocket"></i>
            <span>Ir para o painel</span>
        </a>
        {% else %}
        <div class="flex justify-center gap-4">
            <a href="{% url 'main:login' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg transition-colors">
                <i class="fas fa-sign-in-alt"></i>
                <span>Entrar</span>
            </a>
            <a href="{% url 'main:create_account' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white font-medium rounded-lg transition-colors">
                <i class="fas fa-user-plus"></i>
                <span>Criar Conta</span>
            </a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
