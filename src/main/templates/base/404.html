<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - Brain 🧠</title>
    <!-- Twind Setup for Tailwind CSS in JS -->
    <script src="https://cdn.twind.style"></script>
    <script>
      twind.install({
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: twind.colors.trueGray,
            }
          }
        }
      });
    </script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center shadow-2xl transform translate-y-0 transition-transform duration-500">
        <!-- Ícone sutil que remete a uma tarefa ou nota perdida -->
        <div class="text-blue-500 flex justify-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
              <path d="M5.18 4.616a.5.5 0 0 1 .704.064L8 7.219l2.116-2.54a.5.5 0 1 1 .768.641L8.651 8l2.54 2.116a.5.5 0 0 1-.768.641L8 8.781l-2.116 2.54a.5.5 0 0 1-.704-.064.5.5 0 0 1 .063-.704L7.349 8 4.809 5.884a.5.5 0 0 1 .063-.704.5.5 0 0 1 .308-.163z"/>
              <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 1a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-3a.5.5 0 0 1 .5-.5h3z"/>
            </svg>
        </div>

        {% if user.id %}
            <h1 class="text-3xl font-bold text-white mb-3">Recurso não encontrado</h1>
            <p class="text-gray-400 mb-8">
                Talvez seja hora de fazer uma pausa ☕...
            </p>
            <a href="{% url 'main:welcome' id_user=user.id %}" class="inline-flex items-center justify-center w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
                Voltar para o Início
            </a>
        {% else %}
            <h1 class="text-3xl font-bold text-white mb-3">Quem é você 🤔?</h1>
            <p class="text-gray-400 mb-8">
                Por favor faça login para acessar suas anotações...
            </p>
            <a href="{% url 'main:login' %}" class="inline-flex items-center justify-center w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
                Fazer Login
            </a>
        {% endif %}
    </div>

</body>
</html>
