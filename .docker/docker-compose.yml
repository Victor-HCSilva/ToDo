services:
  db:
    image: postgres:16-alpine
    container_name: django_postgres
    restart: always
    env_file:
      - ../.envs/.env
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: django_api
    restart: always
    command: python manage.py runserver 0.0.0.0:7655
    volumes:
      - ../src:/app/src
    ports:
      - "7655:7655"
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: django_celery_worker
    restart: always
    # Substitua <nome_do_projeto> pelo nome da pasta do módulo onde está seu celery.py
    command: python -m celery -A core worker -l info
    volumes:
      - ../src:/app/src
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: django_celery_beat
    restart: always
    # Substitua <nome_do_projeto> pelo nome da pasta do módulo onde está seu celery.py
    command: python -m celery -A core beat -l info
    volumes:
      - ../src:/app/src
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
