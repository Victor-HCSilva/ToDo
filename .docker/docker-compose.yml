services:
  db:
    image: postgres:16-alpine
    container_name: django_postgres
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      # Aponta para ./.docker/data/ (relativo ao local deste arquivo)
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: django_api
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../src:/app/src
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: django_celery_worker
    restart: always
    # Substitua <nome_do_projeto> pelo nome da pasta do módulo onde está seu celery.py
    command: celery -A <nome_do_projeto> worker -l info
    volumes:
      - ../src:/app/src
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: django_celery_beat
    restart: always
    # Substitua <nome_do_projeto> pelo nome da pasta do módulo onde está seu celery.py
    command: celery -A <nome_do_projeto> beat -l info
    volumes:
      - ../src:/app/src
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy