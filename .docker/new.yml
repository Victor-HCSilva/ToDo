name: brain
services:
  db:
    image: postgres:16-alpine
    container_name: brain_postgres
    restart: always
    env_file:
      - ../.envs/.env
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'     # 50% de 1 núcleo de CPU
          memory: 256M     # Suficiente para dev local no Postgres

  redis:
    image: redis:7-alpine
    container_name: brain_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'     # Redis é levíssimo, 25% de 1 núcleo
          memory: 128M     # Espaço de sobra para filas de mensageria local

  api:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: brain_api
    restart: always
    command: python manage.py runserver 0.0.0.0:7655
    volumes:
      - ../src:/app/src
    ports:
      - "7655:7655"
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.80'     # Permite recarregar rápido o código no runserver
          memory: 512M     # Espaço seguro para o Django carregar dependências e ORM

  celery_worker:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: brain_celery_worker
    restart: always
    # DICA: Adicionado --concurrency=1 para não criar múltiplos processos na sua máquina
    command: python -m celery -A core worker -l info --concurrency=1
    volumes:
      - ../src:/app/src
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  celery_beat:
    build:
      context: ..
      dockerfile: .docker/dockerfile/Dockerfile
    container_name: brain_celery_beat
    restart: always
    command: python -m celery -A core beat -l info
    volumes:
      - ../src:/app/src
    env_file:
      - ../.envs/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'     # Beat é apenas um relógio/agendador
          memory: 128M